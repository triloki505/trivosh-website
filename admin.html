<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Trivosh Admin Panel</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { font-family: Arial, sans-serif; background:#f4f6f5; padding:20px; }
    .panel { max-width:900px; margin:20px auto; background:white; padding:22px; border-radius:12px; }
    input, button { box-sizing:border-box; width:100%; padding:12px; margin:7px 0; }
    button { background:#176b45; color:white; border:0; border-radius:6px; cursor:pointer; }
    .item { border:1px solid #ddd; padding:12px; margin:10px 0; border-radius:8px; }
    .hidden { display:none; }
  </style>
</head>
<body>
  <main class="panel">
    <h1>Trivosh Admin</h1>
    <p>अपने स्टोर और प्रोडक्ट मैनेज करें</p>

    <section id="loginBox">
      <h2>Owner Login</h2>
      <input id="email" type="email" placeholder="Admin email" autocomplete="username">
      <input id="password" type="password" placeholder="Password" autocomplete="current-password">
      <button id="loginBtn">Login</button>
      <p id="loginMessage"></p>
    </section>

    <section id="adminBox" class="hidden">
      <h2>नया प्रोडक्ट जोड़ें</h2>
      <input id="productName" placeholder="Product name">
      <input id="productPrice" type="number" min="0" placeholder="Price ₹">
      <input id="productSize" placeholder="Size, जैसे 1 Litre">
      <input id="productImage" placeholder="Image URL (optional)">
      <input id="productDescription" placeholder="Description">
      <button id="addProductBtn">Add Product</button>

      <h2>आपके प्रोडक्ट</h2>
      <div id="productList">Loading...</div>
      <button id="logoutBtn">Logout</button>
      <p id="adminMessage"></p>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="admin.js"></script>
</body>
</html>
